name: Iris ML API - CI Pipeline - CSE
# Run the workflow when code is pushed or a pull request is created
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# permissions are restricted to read repo content
permissions:
  contents: read
  packages: write

# Define the jobs that make up the pipeline
jobs: # Job 1: Test
    test:
        name: run API test
        # GitHub repo provides a fresh Ubuntu virtual environment for this job
        runs-on: ubuntu-latest
        steps:
            # Step-1: Download the repo content to the runner
            - name: Checkout code repository
              uses: actions/checkout@v4
            # Step-2: Install Python on the runner
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.14"
            # Step-3: Install Python dependencies
            - name: Install Python dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                python -m pip install pytest httpx

            # Step-4: Execute the automated tests
            - name: Run automated tests
              run: python -m pytest -v

    # Step-5: Build the Docker image 
    build-and-publish:
      name: Build and Publish Docker Image
      needs: test
      runs-on: ubuntu-latest
      
      # Publish only when code is pushed to the main branch
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      steps:
        # Download repo source code
        - name: Checkout source code
          uses: actions/checkout@v4
        
        # Enable Docker Buildkit Functionality
        - name: Setup Docker Buildx
          uses: docker/setup-buildx-action@v3

        # Authenticate to GHCR
        - name: Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        # Generate image names and tags
        - name: Generate Docker metadata
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository }}
            tags: |
              type=raw, value=latest
              type=sha, format=short

        # Build the docker image and push it to GHCR
        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}

